    --accent: #ffb86c;
    --accent-ink: #ffcb94;
    --sage: #50fa7b;
    --gray: #b8bcc8;
    --plum: #bd93f9;
    --track: #21222c;

    --blue: #8be9fd;

  }.pxr-post, .pxr-post * { box-sizing: border-box; }.pxr-post {
    background: var(--bg);

    font-size: 2rem;

    color: var(--ink-soft);

    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--sage);
    letter-spacing: 0.06em;
  }.pxr-post h2 {
    font-size: 1.35rem;
    margin: 0;
    text-wrap: balance;
  }.pxr-post .lede {
    color: var(--ink-soft);
    font-size: 0.98rem;
  }.pxr-post .chart {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.6rem 1.6rem 1.3rem;
  }.pxr-post .axis-ref {
    display: grid;
    grid-template-columns: 15rem 1fr 4.2rem;
    gap: 0.6rem;
    margin-bottom: 0.4rem;
  }.pxr-post .axis-ticks {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-soft);
  }.pxr-post .rows {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }.pxr-post .row {
    display: grid;
    grid-template-columns: 15rem 1fr 4.2rem;
    align-items: center;
    gap: 0.6rem;
    /* Fixed to the two-line (label + sub) height so bar-to-bar spacing
       stays even whether or not a given row's sub label is present; the
       label column is widened to keep every sub on one line, so no row
       needs a third line */
    min-height: 1.9rem;
  }.pxr-post .row-label {
    font-size: 0.86rem;
    text-align: right;
    color: var(--ink);
  }.pxr-post .row-label .sub {
    display: block;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }.pxr-post .track {
    position: relative;
    height: 1.6rem;
    background: var(--track);
    border-radius: 4px;
    overflow: hidden;
  }.pxr-post .bar {
    position: absolute;
    inset: 0 auto 0 0;
    background-color: var(--gray);
    border-radius: 4px;
  }.pxr-post .bar.win {
    background-color: var(--accent);
  }.pxr-post .bar.reused {
    background-image: repeating-linear-gradient(
      135deg,
      rgba(0, 0, 0, 0.32) 0 6px,
      transparent 6px 12px
    );
  }.pxr-post /* Real measured range only: seed-to-seed min-max, .pxr-post or a split-to-split range; absent means single-run */
  .err-whisker {
    position: absolute;
    top: 0.15rem;
    bottom: 0.15rem;
    border-left: 1.5px solid rgb(255, 255, 255);
    border-right: 1.5px solid rgb(255, 255, 255);
    opacity: 0.9;
  }.pxr-post .err-whisker::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    border-top: 1.5px solid rgb(255, 255, 255);
  }.pxr-post .mini-track .err-whisker {
    top: 0.1rem;
    bottom: 0.1rem;
  }.pxr-post .row.winner .row-label {
    font-weight: 650;
    color: var(--accent-ink);
  }.pxr-post .mae-val {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.86rem;
    text-align: right;
    color: var(--ink);
  }.pxr-post .row.winner .mae-val {
    font-weight: 650;
    color: var(--accent-ink);
  }.pxr-post .row.ref-divider {
    padding-bottom: 0.55rem;
    margin-bottom: 0.1rem;
    border-bottom: 1px dashed var(--line);
  }.pxr-post .bar.target-bar {
    background-color: var(--target);
  }.pxr-post .row.target .row-label {
    font-style: italic;
    color: var(--target-ink);
  }.pxr-post .row.target .mae-val {
    color: var(--target-ink);
    font-weight: 650;
  }.pxr-post .bar.context-bar {
    background: repeating-linear-gradient(
      135deg,
      var(--target) 0 6px,
      color-mix(in srgb, var(--target) 70%, transparent) 6px 12px
    );
  }.pxr-post .row.context .row-label {
    font-style: italic;
    color: var(--target-ink);
  }.pxr-post .row.context .mae-val {
    color: var(--target-ink);
    font-weight: 650;
  }.pxr-post .bar.floor-bar {
    background-color: var(--plum);
  }.pxr-post .row.floor .row-label {
    font-style: italic;
    color: var(--plum);
  }.pxr-post .row.floor .mae-val {
    color: var(--plum);
    font-weight: 650;
  }.pxr-post .row.single_best .row-label {
    color: var(--blue);
  }.pxr-post .row.single_best .mae-val {
    color: var(--blue);
    font-weight: 650;
  }.pxr-post .row.sweepbest .row-label {
    color: var(--sage);
  }.pxr-post .row.sweepbest .mae-val {
    color: var(--sage);
    font-weight: 650;

    color: var(--magenta);

    color: var(--magenta);

    stroke: var(--ink-soft);

    font-size: 10px;

    stroke-width: 2;

    fill: var(--target);

    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.3rem 1.4rem;

    font-size: 0.92rem;
    font-weight: 650;
    margin: 0 0 0.9rem;

    margin-bottom: 0.5rem;

    border-radius: 3px;
    position: relative;
    overflow: hidden;
  }.pxr-post .mini-bar {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 3px;
  }.pxr-post .mini-tick {
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 2px;
    background: var(--ink);
  }.pxr-post .mini-val {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
    text-align: right;

    border-collapse: collapse;
    font-size: 0.85rem;
    width: 100%;

    text-align: left;
    font-size: 0.92rem;
    font-weight: 650;
    margin-bottom: 0.7rem;
  }.pxr-post table.grid-table th, .pxr-post table.grid-table td {
    border: 1px solid var(--line);
    padding: 0.5rem 0.7rem;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }.pxr-post table.grid-table th:first-child, .pxr-post table.grid-table td:first-child {
    text-align: left;
    font-family: var(--sans);

    background: color-mix(in srgb, var(--accent) 20%, transparent);
    font-weight: 650;
    color: var(--accent-ink);
  }.pxr-post footer {
    border-top: 1px solid var(--line);
    padding-top: 1.6rem;
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-family: var(--mono);
  }
