[project]
name = "pxr-challenge-tabicl"
version = "0.0.0"
description = "Rebuild of the OpenADMET PXR challenge analysis on the challenge's own train+phase1 / phase2 split"
requires-python = ">=3.12"
dependencies = [
    "openadmet-models",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "rdkit>=2024.03",
    "pyarrow>=15",
    "huggingface-hub>=0.24",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.uv.sources]
openadmet-models = { git = "https://github.com/OpenADMET/openadmet-models.git", rev = "4a8df806d12a7385edb6365074ce218af19002a5" }

[tool.uv]
# not an installable package: modules live in src/ and resolve via PYTHONPATH=src
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "run", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "PTH", "D", "PT"]
# D203/D213 conflict with the numpy convention's D211/D212
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# entry-point scripts bootstrap sys.path before importing from src/
"run/*" = ["E402"]
# test functions are self-describing by name; docstrings would restate them
"tests/*" = ["D100", "D103"]

[tool.pyright]
include = ["src", "run", "tests", "tools"]
# the modelling stack lives in the shared venv beside this checkout; uv sync
# does not reproduce it, so pyright is pointed at it explicitly
venvPath = ".."
venv = ".venv"
# openadmet-models is installed editable, which pyright cannot follow, so its
# source tree is resolved directly
extraPaths = ["src", "../openadmet-models"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
# gpu tests fit the tabular foundation models and need an accelerator plus a
# weights download, so they are deselected unless asked for with -m gpu
addopts = "-q -m 'not gpu and not slow'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: fits a tabular foundation model on an accelerator",
    "slow: trains a model; deselected by default",
]
