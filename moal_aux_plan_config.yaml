# PXR challenge — pEC50 prediction using log2FC as an auxiliary input signal
# (moal plan, issue #36 Phases 0-3: auxiliary encoder + concatenation architecture)
#
# Run with:
#   moal plan --config pxr-challenge/moal_aux_plan_config.yaml --output-dir pxr-challenge/results/pxr_aux_predictions

# --------------------------------------------------------------------------
# Dataset and I/O
# --------------------------------------------------------------------------
data:
  output_dir: results/pxr_aux_predictions
  plan:
    input_csv: data/moal_plan_state.csv
    output_csv: pxr_aux_predictions.csv
    smiles_column: smiles
    relation_column: relation
    value_column: value
    weight_column: weight              # PS reliability-ratio / LEFT=1.0 weighting (see prep script)
    log2fc_columns:                    # Raw log2FC readouts at each of the 4 screened concentrations
      - log2fc_9.803e-07
      - log2fc_8.251e-06
      - log2fc_3.300e-05
      - log2fc_9.901e-05
    is_canonical: true                 # SMILES already canonicalized during CSV prep

# --------------------------------------------------------------------------
# Random seed
# --------------------------------------------------------------------------
seed: 42

# --------------------------------------------------------------------------
# Oracle / assay parameters
# --------------------------------------------------------------------------
oracle:
  cost_ps: 1.0
  cost_drc: 10.0
  ps_threshold: 4.0                   # Hit/miss called by whether the compound hit at ANY tested
                                       # concentration (monotonicity implies a hit here too); the graded
                                       # per-concentration signal instead rides on the log2fc_* columns.
  upper_bound: 11.0
  activity_threshold: 6.0

# --------------------------------------------------------------------------
# Acquisition function
# --------------------------------------------------------------------------
acquisition:
  ps_threshold: 4.0                   # Must match oracle.ps_threshold
  target_threshold: 6.0
  tau: 0.1
  embedding_provenance_discount: 1.0  # No discount initially; all TEST_BLINDED compounds are
                                       # embedding-derived (no PS readouts), so a discount here would
                                       # uniformly rescale rather than differentiate the ranking

# --------------------------------------------------------------------------
# ChemProp / CheMeleon main model
# --------------------------------------------------------------------------
model:
  ffn_hidden_dim: 512
  ffn_num_layers: 3
  freeze_epochs: 0
  mpnn_lr: 1.0e-3
  ffn_lr: 1.0e-3
  sigma: 0.5                          # Main model trains on DRC records only (see cli.py), so w_drc/w_ps
                                       # would be vestigial (no PS records reach this loss); left at defaults.
  from_foundation: chemeleon
  fast: false

# --------------------------------------------------------------------------
# Auxiliary encoder architecture (issue #36) — pretrained on raw log2FC
# readouts, shares the main model's CheMeleon backbone (mean aggregation)
# --------------------------------------------------------------------------
auxiliary_model:
  from_foundation: chemeleon
  ffn_hidden_dim: 512
  ffn_num_layers: 2
  freeze_epochs: 0
  lr: 1.0e-3
  use_observed_readout: false          # Embedding-only for every compound (never the raw log2FC value),
                                        # so training and inference always share one input pathway; the
                                        # last run left this at the True default (embedding + raw value
                                        # when available), so this condition hasn't been tested yet.
  checkpoint_path: null                # Retrain fresh every run

# --------------------------------------------------------------------------
# PyTorch Lightning trainer (main model)
# --------------------------------------------------------------------------
trainer:
  max_epochs: 50
  accelerator: gpu
  enable_progress_bar: false
  enable_model_summary: false
  val_fraction: 0.2
  split_seed: 42
  num_workers: 0
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  early_stopping: true
  early_stopping_monitor: val_loss     # Main model's logged validation metric name
  early_stopping_patience: 10
  early_stopping_mode: min
  early_stopping_min_delta: 0.001

# --------------------------------------------------------------------------
# PyTorch Lightning trainer (auxiliary encoder pretraining) — scheduled
# independently from the main model's trainer above
# --------------------------------------------------------------------------
auxiliary_trainer:
  max_epochs: 50
  accelerator: gpu
  enable_progress_bar: false
  enable_model_summary: false
  val_fraction: 0.2                    # Now actually wired to config (previously hardcoded, invisible)
  split_seed: 42
  num_workers: 0
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  early_stopping: true
  early_stopping_monitor: aux_val_loss # NOT val_loss — the aux encoder logs a different key
  early_stopping_patience: 10
  early_stopping_mode: min
  early_stopping_min_delta: 0.001
