# The coverage spec: what the rebuild sweeps, declared as axes and the stages
# that sweep them, rather than enumerated configuration by configuration.
#
# Two rules shape it, and they are not the same rule.
#
# Nothing is excluded on the prior sweep's evidence. The prior scored phase 1
# and phase 2 pooled (n = 513) and this rebuild scores phase 2 alone (n = 260),
# so a configuration dropped on the prior's ranking would rest on an
# incomparable measurement, and a reproduction with built-in exceptions is
# hostile to whoever reruns it. experiments/prior_summary.csv stays as context
# and as a check that nothing was forgotten; it decides nothing.
#
# Dimensions are still swept one stage at a time, each stage fixing what the
# last one settled. That is a compute decision, not an evidential one: every
# level of the dimension under test is run, and only the dimensions already
# answered on this split are held fixed.

version: 2

anchor:
  name: N283T, challenge leaderboard, phase 2
  n: 260
  mae_ensemble: 0.4113
  mae_single: 0.437
  note: >
    The only absolute reference in this repository. Prior metrics rank
    configurations against each other and are not comparable to this number.

prior:
  source: "main:reporting/results.parquet @ 00be37e"
  summary: experiments/prior_summary.csv
  eval: phase1+phase2 pooled, n=513
  role: >
    Context only. Used to check that every configuration the previous
    generation ran is expressible here, never to decide what runs.

split:
  fit: data/splits/fit_all.csv
  fit_train: data/splits/fit_train.csv
  fit_val: data/splits/fit_val.csv
  test: data/splits/test_phase2.csv
  n_fit: 4392
  n_test: 260

seeds: [0, 1, 2, 3, 4]

# ---------------------------------------------------------------------------
# The tabular axes, and the stages that sweep them.
# ---------------------------------------------------------------------------
tabular:
  axes:
    embedding:
      none: null
      chemeleon: {block: chemeleon, pca: 256}
      chemprop_log2fc: {block: chemprop_log2fc_embedding, pca: null}
      chemeleon_log2fc: {block: chemeleon_log2fc_embedding, pca: 256}
      chemeleon_pec50: {block: chemeleon_pec50_embedding, pca: 256}
    readout:
      none: null
      # two predicted log2FC columns; they mean something column by column, so
      # they are passed through rather than rotated
      chemprop_log2fc: {block: chemprop_log2fc_readout, pca: null}
    descriptors:
      none: null
      mordred: {blocks: [mordred]}
      rdkit: {blocks: [rdkit]}
      rdkit_mordred: {blocks: [rdkit, mordred]}
    descriptor_pca: [64, 128, 256]
    regressor:
      - lgbm
      - xgboost
      - tabpfn-v2.5
      - tabpfn-v2.6
      - tabpfn-v3
      - tabicl
      - tabfm
    calibration:
      - none
      - isotonic_fitval

  constraints:
    non_empty: >
      A featureset with no embedding, no readout and no descriptors is not a
      configuration; it is dropped from the cross product.
    width_needs_descriptors: >
      descriptor_pca changes nothing when there are no descriptors, so it is
      pinned to its default there rather than generating three identical
      configurations.

  calibration_note: >
    The isotonic arm costs one additional fit per configuration and seed: train
    on fit_train, predict the held-out fit_val, fit the isotonic map on those
    predictions, then apply it to the phase-2 predictions of the model fitted on
    fit_all. It is a separate arm rather than a post-processing step because
    fitting the map needs predictions the model has not seen. Running it in its
    own stage, on the configuration the earlier gates settled, costs ten runs
    rather than doubling the sweep.

  # Each stage sweeps every level of the dimensions it names, and holds fixed
  # only what an earlier gate already decided on this split.
  stages:
    - id: featureset_and_regressor
      figures: [fig2, fig3, fig4]
      sweeps: [embedding, readout, descriptors, regressor]
      fixed:
        descriptor_pca: 128
        calibration: none
      note: >
        The featureset and the regressor are swept together rather than in
        sequence, because neither can be fixed first without pre-committing to
        the other, and choosing a starting regressor from the prior sweep is the
        one thing this rebuild will not do. Crossing them costs seven times a
        single-regressor sweep and removes the ordering problem entirely.
        Figures 2, 3 and 4 are three readings of this one table: the
        single-block rows, the combinations, and the regressor facet.
      gate:
        id: best_configuration
        chooses: [embedding, readout, descriptors, regressor]
        rule: >
          Lowest mean MAE across five seeds on phase 2. A paired bootstrap over
          the 260 compounds is reported for the leading configurations, and
          where the interval does not separate them the cheaper featureset is
          taken, with the tie recorded rather than hidden.

    - id: descriptor_width
      figures: [fig5]
      sweeps: [descriptor_pca]
      fixed_from: best_configuration
      note: >
        Skipped when the winning configuration carries no descriptor block,
        since there is then no width to sweep.
      gate:
        id: best_width
        chooses: [descriptor_pca]
        rule: Lowest mean MAE across five seeds, same bootstrap treatment.

    - id: calibration
      figures: [fig6]
      sweeps: [calibration]
      fixed_from: best_width
      gate: null

    - id: uncertainty
      figures: [fig7]
      sweeps: []
      fixed_from: best_width
      reuses_runs: true
      note: >
        A diagnostic over predictions the earlier stages already wrote, adding
        no runs of its own.

# ---------------------------------------------------------------------------
# The graph-network cells, which are heterogeneous enough to enumerate. The
# freeze/width/clip grid is a cross product; the rest are named variants.
# ---------------------------------------------------------------------------
gnn:
  grids:
    - id: concat
      title: Concatenation architecture, freeze and width and clip
      axes:
        freeze_epochs: [0, 1, 2]
        ffn_hidden_dim: [512, 1024]
        gradient_clip_val: [1.0, 5.0, null]
      # abbreviations used in run directory names, matching the previous
      # generation's convention so a reader can line the two up
      slug_names:
        freeze_epochs: freeze
        ffn_hidden_dim: hd
        gradient_clip_val: clip
      fixed:
        encoder_init: chemeleon
        finetune_target: pec50
        aux_encoder:
          target: log2fc
          tasks: 2
          use_observed_readout: false
          use_predicted_readout: false
      note: >
        All 18 cells run. Only one of them produced metrics that survived into
        the prior aggregation, so this axis was never settled and cannot be
        pruned against anything.

  cells:
    - id: readout_observed_2task
      title: Observed log2FC readout, two tasks
      axes: &concat_base
        encoder_init: chemeleon
        finetune_target: pec50
        ffn_hidden_dim: 512
        freeze_epochs: 2
        gradient_clip_val: 1.0
        aux_encoder:
          target: log2fc
          tasks: 2
          use_observed_readout: true
          use_predicted_readout: false
      prior: feat_observed_2task

    - id: readout_observed_4task
      title: Observed log2FC readout, four tasks
      axes:
        <<: *concat_base
        aux_encoder:
          target: log2fc
          tasks: 4
          use_observed_readout: true
          use_predicted_readout: false
      prior: feat_observed_4task

    - id: readout_predicted_2task
      title: Predicted log2FC readout, two tasks
      axes:
        <<: *concat_base
        aux_encoder:
          target: log2fc
          tasks: 2
          use_observed_readout: false
          use_predicted_readout: true
      prior: feat_predicted_native_2task

    - id: readout_observed_and_predicted_2task
      title: Observed and predicted log2FC readout
      axes:
        <<: *concat_base
        aux_encoder:
          target: log2fc
          tasks: 2
          use_observed_readout: true
          use_predicted_readout: true
      prior: feat_observed_and_predicted_2task

    - id: e4_frozen
      title: E4, body pretrained on log2FC and never unfrozen
      axes:
        encoder_init: log2fc_checkpoint
        finetune_target: pec50
        ffn_hidden_dim: 512
        freeze_epochs: 50
        gradient_clip_val: 1.0
        aux_encoder: null
      prior: e4_frozen

    - id: e4_finetune
      title: E4, warmup then unfreeze
      axes:
        encoder_init: log2fc_checkpoint
        finetune_target: pec50
        ffn_hidden_dim: 512
        freeze_epochs: 2
        gradient_clip_val: 1.0
        aux_encoder: null
      prior: e4_finetune

    - id: chemeleon_pec50
      title: CheMeleon fine-tuned on pEC50, no auxiliary encoder
      axes:
        encoder_init: chemeleon
        finetune_target: pec50
        ffn_hidden_dim: 512
        freeze_epochs: 2
        gradient_clip_val: null
        aux_encoder: null
      prior: pxr_baseline_chemeleon_pec50

# ---------------------------------------------------------------------------
# Figures are slices of the completed table, not a sequence of gates. No figure
# waits on another's winner, so there is no ordering to respect and no
# backfill rule to apply after an upset.
# ---------------------------------------------------------------------------
figures:
  - id: fig1
    title: Graph-network baselines
    question: Where does a fine-tuned message-passing network land on the challenge split?
    select: {kind: gnn}

  - id: fig2
    title: Single-ingredient tabular features
    question: How far does each feature block get on its own?
    select: {kind: tabular, n_blocks: 1, descriptor_pca: 128, calibration: none}

  - id: fig3
    title: Featureset combinations
    question: Which combination of blocks wins?
    select: {kind: tabular, descriptor_pca: 128, calibration: none}

  - id: fig4
    title: Regressor comparison
    question: Which regressor wins, and does the answer depend on the featureset?
    select: {kind: tabular, descriptor_pca: 128, calibration: none}
    facet: regressor

  - id: fig5
    title: Descriptor PCA width
    question: How much does the descriptor block's width matter?
    select: {kind: tabular, has_descriptors: true, calibration: none}
    facet: descriptor_pca

  - id: fig6
    title: Isotonic calibration
    question: Does post-hoc isotonic calibration help on the challenge split?
    select: {kind: tabular, descriptor_pca: 128}
    facet: calibration

  - id: fig7
    title: Predicted uncertainty against actual error
    question: Do the winning models' uncertainty estimates track their errors?
    select: {kind: tabular, calibration: none, has_uncertainty: true}
