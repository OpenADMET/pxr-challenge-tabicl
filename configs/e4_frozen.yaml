# PXR challenge — E4 (Buterez et al. 2024), permanent-freeze variant
# Stage 2: fine-tune only the FFN readout on pEC50, on top of a message-passing
# body pretrained on log2FC (stage 1: e4_log2fc_pretrain/log2fc_pretrain.yaml,
# converted via convert_to_foundation_checkpoint.py). freeze_epochs >= max_epochs
# means the body never unfreezes for the whole run, matching E4's "freeze GNN
# body, fine-tune only the adaptive readout" literally. No auxiliary_model here:
# E4 replaces the foundation init itself, it doesn't use the E3 concatenation
# architecture moal_aux_plan_config.yaml implements.
#
# Run with:
#   moal plan --config pxr-challenge/configs/e4_frozen.yaml --output-dir pxr-challenge/results/e4_frozen

data:
  output_dir: results/e4_frozen
  plan:
    input_csv: data/moal_plan_state.csv
    output_csv: pxr_e4_frozen_predictions.csv
    smiles_column: smiles
    relation_column: relation
    value_column: value
    weight_column: weight
    log2fc_columns:
      - log2fc_8.251e-06
      - log2fc_3.300e-05
    is_canonical: true

seed: 42

oracle:
  cost_ps: 1.0
  cost_drc: 10.0
  ps_threshold: 4.0
  upper_bound: 11.0
  activity_threshold: 6.0

acquisition:
  ps_threshold: 4.0
  target_threshold: 6.0
  tau: 0.1
  embedding_provenance_discount: 1.0

model:
  ffn_hidden_dim: 512
  ffn_num_layers: 3
  freeze_epochs: 50                   # >= trainer.max_epochs: body never unfreezes
  mpnn_lr: 1.0e-3
  ffn_lr: 1.0e-3
  sigma: 0.5
  from_foundation: e4_log2fc_pretrain/log2fc_mp.pt   # set after running convert_to_foundation_checkpoint.py
  fast: false

trainer:
  max_epochs: 50
  accelerator: gpu
  enable_progress_bar: false
  enable_model_summary: false
  val_fraction: 0.2
  split_seed: 42
  num_workers: 0
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  early_stopping: true
  early_stopping_monitor: val_loss
  early_stopping_patience: 10
  early_stopping_mode: min
  early_stopping_min_delta: 0.001
